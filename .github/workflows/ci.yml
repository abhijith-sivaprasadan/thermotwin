name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '43 5 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  # Preserve every merged main commit's verification; supersede only outdated PR/feature runs.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: ${{ matrix.os }} / ${{ matrix.profile }} / OpenMP
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        profile: [release, debug]
    env:
      OMP_NUM_THREADS: '2'
      OMP_DYNAMIC: 'FALSE'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Cache compiler package downloads
        if: runner.os != 'Windows'
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/thermotwin-apt
            ~/Library/Caches/Homebrew
          key: ${{ runner.os }}-${{ runner.arch }}-gcc-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-gcc-
      - name: Install Linux compiler
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$HOME/.cache/thermotwin-apt/partial"
          sudo apt-get update
          sudo apt-get -o Dir::Cache::archives="$HOME/.cache/thermotwin-apt" install -y gfortran g++ make
          # apt owns its lock/partial paths; the cache action runs as runner.
          sudo chown -R "$(id -u):$(id -g)" "$HOME/.cache/thermotwin-apt"
      - name: Install macOS compiler
        if: runner.os == 'macOS'
        run: |
          brew install gcc
          compiler=$(find "$(brew --prefix gcc)/bin" -name 'gfortran-*' -type f | sort | tail -n 1)
          test -n "$compiler"
          echo "FC=$compiler" >> "$GITHUB_ENV"
          echo "$(dirname "$compiler")" >> "$GITHUB_PATH"
      - name: Install Windows compiler
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: make mingw-w64-ucrt-x86_64-gcc-fortran
      - name: Expose Windows compiler to Python and Make
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          'C:\msys64\ucrt64\bin' | Out-File -FilePath $env:GITHUB_PATH -Append
          'C:\msys64\usr\bin' | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Existing suite and scenario regressions (OpenMP)
        run: python scripts/ci_verify.py --profile ${{ matrix.profile }} --openmp 1
      - name: Existing suite and scenario regressions (serial build)
        run: python scripts/ci_verify.py --profile ${{ matrix.profile }} --openmp 0
      - name: Full-field serial versus OpenMP equivalence and wall timing
        run: python scripts/benchmark_openmp.py --compiler '${{ env.FC || 'gfortran' }}' --cases 20000 --repeats 1 --output build/ci-benchmark.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openmp-${{ matrix.os }}-${{ matrix.profile }}
          path: build/ci-benchmark.json

  reference-metadata:
    name: Citation and CoolProp independent IF97 comparison
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Fortran compiler
        run: sudo apt-get update && sudo apt-get install -y gfortran make
      - name: Install pinned reference dependencies
        run: python -m pip install PyYAML==6.0.3 CoolProp==8.0.0
      - name: Validate citation, ORCID and version consistency
        run: python scripts/check_release_metadata.py
      - name: Audit internal research documentation links
        run: python scripts/check_repository_links.py
      - name: Verify build cleanup cannot remove sources or outside paths
        run: python -m unittest scripts.test_clean -v
      - name: Test Open-Meteo weather boundary units, QC and replay
        run: python -m unittest scripts.test_open_meteo_boundary -v
      - name: Generate independent IF97 discrepancies
        run: |
          make property-reference-grid
          python scripts/benchmark_if97.py --output build/if97_benchmark.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-if97-comparison
          path: build/if97_benchmark.json

  windows-gui-compile:
    name: Windows GUI build (not interactive acceptance)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: make curl mingw-w64-ucrt-x86_64-gcc-fortran mingw-w64-ucrt-x86_64-gcc
      - name: Expose build toolchain
        shell: pwsh
        run: |
          'C:\msys64\ucrt64\bin' | Out-File -FilePath $env:GITHUB_PATH -Append
          'C:\msys64\usr\bin' | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Compile explicit offline GUI without network or OPC UA vendor sources
        run: make -j4 gui-offline
      - name: Download pinned optional OPC UA implementation
        run: make download-opcua
      - name: Compile GUI
        run: make -j4 gui
      - name: Disclose remaining manual tests
        run: echo Compile only. Complete docs/GUI_ACCEPTANCE.md before distributing the GUI binary.

  independent-rankine-fixture:
    name: TESPy reference Rankine fixture (not model validation)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install pinned TESPy reference solver
        run: python -m pip install tespy==0.11.2
      - name: Assert reference-unit conversion and physical bounds
        run: python -m unittest scripts.test_tespy_reference -v
      - name: Execute independently defined Rankine example
        run: python scripts/tespy_rankine_reference.py
      - name: Verify reference artifact schema and plausible net power
        run: |
          python -c "import json; d=json.load(open('build/tespy_rankine_reference.json')); assert d['network_converged']; assert 5.0 <= d['net_power_MW_magnitude'] <= 25.0; assert abs(d['net_power_W_magnitude']/1e6-d['net_power_MW_magnitude']) < 1e-6"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-tespy-rankine
          path: build/tespy_rankine_reference.json

  passoff-equations:
    name: Physics-based pass-off correction and instrument covariance tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Independent analytic and negative-input correction tests
        run: python -m unittest scripts.test_passoff_correction -v
      - name: Assert no fabricated production test cases are distributed
        run: |
          python -c "from pathlib import Path; p=Path('scripts/passoff_correction.py'); assert p.is_file(); assert not any(Path('cases').glob('*passoff*'))"

  real-turbine-uci551:
    name: Real UCI-551 turbine measurements and chronological holdout
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Validate annual source schema and reject malformed measurements
        run: python -m unittest scripts.test_fetch_uci_gt551 -v
      - name: Install pinned numerical dependency
        run: python -m pip install numpy==2.2.6
      - name: Verify physically derived covariates and adjustment algebra
        run: python -m unittest scripts.test_analyze_uci_gt551 -v
      - name: Fetch canonical original one-turbine UCI dataset with source hashes
        run: python scripts/fetch_uci_gt551.py --output-dir build/uci551
      - name: Evaluate real condition-adjusted residuals with untouched 2014–2015 holdout
        run: python scripts/analyze_uci_gt551.py --data-dir build/uci551 --output build/uci551/condition_residual_report.json
      - name: Audit source provenance and untouched evaluation
        run: |
          python -c "from pathlib import Path; import json,hashlib; p=Path('build/uci551'); m=json.loads((p/'manifest.json').read_text()); r=json.loads((p/'condition_residual_report.json').read_text()); assert m['total_rows']==36733 and m['number_of_turbines']==1; assert m['original_zip_sha256']==hashlib.sha256((p/'uci551_original.zip').read_bytes()).hexdigest(); assert r['measured_observations']==36733 and r['untouched_evaluation_years']==[2014,2015]; assert r['holdout']['rows']==14542; assert r['not_a_pass_off_or_known_fault_dataset'] and not r['measured_gt_power_MW_claimed']"
          python -c "import json,math; from pathlib import Path; r=json.loads(Path('build/uci551/condition_residual_report.json').read_text()); b=r['development_forward_origin_backtests']; assert b['2012']['fit_years']==[2011] and b['2013']['fit_years']==[2011,2012]; h=r['holdout']; assert math.isfinite(h['training_mean_baseline_rmse_source_TEY_units']); d=r['heldout_adjacent_row_resampling_sensitivity']; assert d['block_lengths_published_rows']==[32,64,128] and d['replicates_per_block_length']==400; assert 0<=r['heldout_covariate_support']['heldout_fraction_outside_any_feature']<=1; assert math.isfinite(r['condition_adjustment']['training_residual_lag1_within_year_demeaned'])"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-uci551-source-and-evaluation
          path: build/uci551/

  real-weather-archive:
    name: Real ERA5 weather boundary integration (reanalysis, not GT test data)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Fetch one real, past ERA5 model hour near Lincoln
        run: |
          python scripts/open_meteo_boundary.py \
            --source archive --model era5 \
            --latitude 53.23 --longitude -0.54 \
            --valid-time 2025-10-01T12:00:00Z \
            --output build/weather/lincoln_era5_boundary.csv \
            --snapshot build/weather/lincoln_era5_raw.json
      - name: Assert original response exists and has a traceable digest
        run: |
          python -c "from pathlib import Path; import hashlib,json; p=Path('build/weather/lincoln_era5_raw.json'); m=json.loads(Path('build/weather/lincoln_era5_boundary.manifest.json').read_text()); assert m['raw_response_sha256']==hashlib.sha256(p.read_bytes()).hexdigest(); assert m['meteo_type']=='reanalysis' and not m['flange_condition_measured']"
      - name: Install Fortran compiler for source-backed model integration
        run: sudo apt-get update && sudo apt-get install -y gfortran make
      - name: Replay verified weather through declared dry-air approximation
        run: |
          python scripts/open_meteo_boundary.py \
            --source archive --model era5 \
            --latitude 53.23 --longitude -0.54 \
            --valid-time 2025-10-01T12:00:00Z \
            --response-json build/weather/lincoln_era5_raw.json \
            --reference-case cases/site_iso_flange_reference.csv --dry-air-approximation \
            --output build/weather/lincoln_era5_model_boundary.csv
      - name: Evaluate off-design Fortran site physics at actual ERA5 T and surface P
        run: |
          make -j4
          ./thermotwin site cases/site_iso_flange_reference.csv \
            build/weather/lincoln_era5_model_boundary_case.csv \
            build/weather/lincoln_era5_site_model.csv
          python -c "import csv; d=next(csv.DictReader(open('build/weather/lincoln_era5_site_model.csv'))); assert d['valid']=='1' and 0.5<float(d['power_derate_ratio'])<1.5; print('Model-derived power ratio:',d['power_derate_ratio'],'HR correction:',d['heat_rate_correction_ref_per_site'])"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-era5-boundary-and-source
          path: build/weather/*


  lincoln-source-backed-dossier:
    name: Recruiter evidence dossier from UCI + ERA5 source artifacts
    needs: [real-turbine-uci551, real-weather-archive]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Check fail-closed evidence/figure generator against mathematical fixtures only
        run: python -m unittest scripts.test_build_lincoln_dossier -v
      - name: Retrieve audited original UCI source and holdout JSON from this exact run
        uses: actions/download-artifact@v4
        with:
          name: real-uci551-source-and-evaluation
          path: build/uci551
      - name: Retrieve original ERA5 reanalysis and actual Fortran site-model outputs
        uses: actions/download-artifact@v4
        with:
          name: real-era5-boundary-and-source
          path: build/weather
      - name: Generate actual-source dossier, two SVG figures and SHA-256 audit ledger
        run: |
          python scripts/build_lincoln_dossier.py \
            --uci-dir build/uci551 \
            --weather-dir build/weather \
            --reference-case cases/site_iso_flange_reference.csv \
            --output-dir build/lincoln-dossier
      - name: Make the dossier and figures inspectable as one source-locked artifact
        uses: actions/upload-artifact@v4
        with:
          name: lincoln-source-backed-engineering-dossier
          path: build/lincoln-dossier/
          if-no-files-found: error


  historical-era5-seasonal-site-study:
    name: Original ERA5 four-season fixed-engine site sensitivity
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Reject incomplete weather, wrong units and false model identities
        run: python -m unittest scripts.test_study_era5_site_windows -v
      - name: Acquire four genuine seven-day 2025 ERA5 windows, source hashes and audited input cases
        run: |
          python -m scripts.study_era5_site_windows acquire \
            --out build/era5-seasonal \
            --reference cases/site_iso_flange_reference.csv
      - name: Install the generic Fortran engineering model compiler
        run: sudo apt-get update && sudo apt-get install -y gfortran make
      - name: Compute every ERA5 hour under four declared, assumed pressure-loss boundaries
        run: |
          make -j4
          ./thermotwin site cases/site_iso_flange_reference.csv \
            build/era5-seasonal/site_cases.csv \
            build/era5-seasonal/site_results.csv
      - name: Verify original sources, boundary equations, every Fortran record and seasonal statistics
        run: |
          python -m scripts.study_era5_site_windows summarize \
            --out build/era5-seasonal \
            --reference cases/site_iso_flange_reference.csv
          python -c "import json; from pathlib import Path; r=json.loads(Path('build/era5-seasonal/study_report.json').read_text()); assert r['source_hours']==672 and r['model_cases']==2688 and r['model_form_uncertainty_not_quantified'] and not r['engine_specific_validation']; assert len(r['seasonal'])==4 and all(s['original_reanalysis_hours']==168 for s in r['seasonal'])"
      - name: Upload original ERA5 JSON, source manifests, all solver CSVs and validated study
        uses: actions/upload-artifact@v4
        with:
          name: era5-four-seasons-source-backed-site-study
          path: build/era5-seasonal/
          if-no-files-found: error

  observed-smart-gtpp-source-audit:
    name: Independent observed SMART-GTPP original-source examination
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Download measured source and report exact file columns with dataset hash
        run: python -m scripts.fetch_smart_gtpp --out build/smart-gtpp
      - name: Preserve original external measured source and provenance-only metadata
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smart-gtpp-original-measurements-provenance
          path: build/smart-gtpp/
          if-no-files-found: error

  legacy-report-smoke:
    name: CLI report regeneration smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install CLI compiler and plotting dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y gfortran make
          python -m pip install numpy==2.2.6 matplotlib==3.10.3
      - name: Rebuild original CLI reporting pipeline
        run: |
          bash scripts/run_pipeline.sh
          python -c "from pathlib import Path; p=Path('output/ThermoTwin-F_report.pdf'); assert p.exists() and p.stat().st_size > 1000"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regenerated-cli-report-smoke
          path: |
            output/ThermoTwin-F_report.pdf
            output/figures/*.png
