name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux / ${{ matrix.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile: [release, debug]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip
      - name: Install compiler and reporting dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran make
          python -m pip install -r requirements.txt
      - name: Build and verify
        run: make -j4 PROFILE=${{ matrix.profile }} PYTHON=python check scenarios
      - name: Analysis pipeline
        run: make PROFILE=${{ matrix.profile }} PYTHON=python pipeline
      - name: Upload reproducible study outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-linux-${{ matrix.profile }}
          path: |
            build/analysis/
            build/debug/analysis/
          if-no-files-found: ignore

  windows:
    name: Windows / MinGW-w64
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v6
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc-fortran
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python
      - name: Build and verify native CLI and offline GUI
        run: make -j4 check scenarios gui
      - name: CSV pipeline without optional plotting libraries
        run: python scripts/run_pipeline.py --skip-report
